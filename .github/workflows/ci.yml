name: ETL Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Test Suite & Diagnostics
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Run Test Suite
      # conftest.py points the suite at a throwaway SQLite database and the offline LLM engine
      run: |
        python -m pytest -v

    - name: Verify Offline Pipeline Runner
      env:
        LLM_PROVIDER: mock
        DATABASE_URL: sqlite:///./ci_verify.db
      run: |
        python verify_pipeline.py

  docker:
    name: Build & Smoke-Test Docker Image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Image
      run: docker build -f docker/Dockerfile.backend -t etl-backend .

    - name: Run Like Render (custom $PORT, persistent volume, production)
      run: |
        mkdir -p "$RUNNER_TEMP/volume"
        docker run -d --name etl -p 10000:10000 \
          -e PORT=10000 -e ENV=production -e LLM_PROVIDER=mock \
          -e STORAGE_DIR=/var/data -e SECRET_KEY=ci-secret \
          -e DEFAULT_ADMIN_PASSWORD=ci-strong-password-123 \
          -v "$RUNNER_TEMP/volume:/var/data" etl-backend
        for i in $(seq 1 30); do
          curl -fsS http://localhost:10000/api/v1/health && break
          sleep 2
        done
        curl -fsS http://localhost:10000/api/v1/health
        curl -fsS http://localhost:10000/ | grep -q "Control AI"
        curl -fsS -X POST http://localhost:10000/api/v1/auth/login \
          -H 'Content-Type: application/json' \
          -d '{"username":"admin@controlai.net","password":"ci-strong-password-123"}' | grep -q token
        # Runtime data must land on the volume
        test -f "$RUNNER_TEMP/volume/agentic_ai_etl.db"
        test -d "$RUNNER_TEMP/volume/Accounts"

    - name: Container Logs
      if: always()
      run: docker logs etl || true
