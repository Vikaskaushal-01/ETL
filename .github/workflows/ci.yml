name: ETL Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Test Suite & Diagnostics
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Run Test Suite
      # conftest.py points the suite at a throwaway SQLite database and the offline LLM engine
      run: |
        python -m pytest -v

    - name: Verify Offline Pipeline Runner
      env:
        LLM_PROVIDER: mock
        DATABASE_URL: sqlite:///./ci_verify.db
      run: |
        python verify_pipeline.py
