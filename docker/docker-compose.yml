services:
  db:
    image: mysql:8.0
    container_name: etl_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agentic_ai_etl
      MYSQL_USER: etl_user
      MYSQL_PASSWORD: etl_password
    ports:
      - "3306:3306"
    volumes:
      # The backend creates and migrates its own tables on startup
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uetl_user", "-petl_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional local LLM: `docker compose --profile ollama up`, then `docker exec etl_ollama ollama pull llama3`
  ollama:
    image: ollama/ollama:latest
    container_name: etl_ollama
    restart: always
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: etl_backend
    restart: always
    ports:
      - "8000:8000"
    # GEMINI_API_KEY, SECRET_KEY, DEFAULT_ADMIN_PASSWORD, ... are read from the project .env
    env_file:
      - path: ../.env
        required: false
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DB=agentic_ai_etl
      - MYSQL_USER=etl_user
      - MYSQL_PASSWORD=etl_password
      - OLLAMA_HOST=http://ollama:11434
      - ENV=production
    volumes:
      # Per-account workspaces (uploads, cleaned data, reports, logs) must survive container rebuilds
      - ../Accounts:/app/Accounts
      # Shared intake folder for SnapLogic (files dropped in data/raw are processed via /pipeline/start)
      - ../data:/app/data
      - ../reports:/app/reports
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  ollama_data:
